<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Gulsahsuperbro — Sahil Koşusu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div id="hud-left">
        <span id="score">SKOR: 0</span>
        <span id="lives">CAN: 3</span>
        <span id="moto"></span>
      </div>
      <div id="hud-title">GULSAHSUPERBRO</div>
    </div>
    <canvas id="game" width="960" height="540"></canvas>

    <div id="overlay">
      <div id="overlay-box">
        <h1 id="overlay-title">GULSAHSUPERBRO</h1>
        <p id="overlay-text">Bostancı'dan Tuzla Marina'ya koş!<br/>Ok tuşları / A-D: hareket, Space / W: zıpla</p>
        <div id="overlay-buttons"></div>
      </div>
    </div>

    <div id="touch-controls">
      <div id="tc-left" class="tc-btn">◀</div>
      <div id="tc-right" class="tc-btn">▶</div>
      <div id="tc-jump" class="tc-btn">⤒</div>
    </div>

    <button id="send-btn" class="hidden">GÖNDER</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
